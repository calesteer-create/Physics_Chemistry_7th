# بناء المنصة والتحقق منها، ثم نشرها على Vercel (بيئة الإنتاج).
#
# لماذا Vercel: تشغيل Next.js 16 كاملاً (App Router، proxy/middleware، مسارات API،
# العرض على الخادم) دون تعديل إعدادات المشروع، مع دعم قاعدة PostgreSQL خارجية
# عبر `DATABASE_URL` — بخلاف GitHub Pages الذي يخدم ملفات ثابتة فقط.
#
# لا تُحفظ أي أسرار في المستودع. تُضبط في:
#   - أسرار المستودع (Settings → Secrets and variables → Actions):
#       VERCEL_TOKEN / VERCEL_ORG_ID / VERCEL_PROJECT_ID
#   - متغيّرات بيئة مشروع Vercel (Settings → Environment Variables):
#       DATABASE_URL / TEACHER_PASSWORD / TEACHER_SESSION_SECRET / STUDENT_SESSION_SECRET
#
# السلوك المقصود:
#   - النشر على `main` فقط (push أو تشغيل يدوي). أي فرع آخر أو PR = فحص فقط.
#   - عند غياب أي من أسرار Vercel الثلاثة تظهر مهمة النشر كـ **skipped** (لا
#     تُنفَّذ خطوة نشر واحدة)، ويُكتب سبب التخطي في ملخّص التشغيل.
#   - عند توفّرها تُنفَّذ خطوة النشر فعليًا، وأي فشل فيها يُفشل التشغيل (لا يُحجب
#     بسبب الأنابيب: pipefail مُفعَّل).

name: Build & Deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: فحص البناء والاختبارات
    runs-on: ubuntu-latest
    steps:
      - name: تنزيل الشيفرة
        uses: actions/checkout@v5

      - name: تهيئة Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm

      - name: تثبيت الاعتماديات
        run: npm ci

      - name: تدقيق الشيفرة
        run: npm run lint

      - name: فحص الأنواع
        run: npm run typecheck

      - name: اختبارات الوحدة
        run: npm test

      # البناء لا يحتاج DATABASE_URL (التهيئة متأخرة في src/db/index.ts).
      - name: بناء الإنتاج
        run: npm run build

  # بوابة منفصلة: تُقرأ الأسرار مرة واحدة، ويُبنى قرار النشر على ناتجها.
  # إن غاب أي سرّ تظهر مهمة النشر التالية كـ skipped بدل أن تبدو ناجحة.
  gate:
    name: التحقق من أسرار النشر
    needs: verify
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    outputs:
      ready: ${{ steps.secrets.outputs.ready }}
    steps:
      - name: فحص توفّر أسرار Vercel الثلاثة
        id: secrets
        run: |
          set -euo pipefail
          # ${VAR:-} كي لا يفشل الفحص بسبب set -u عند غياب المتغيّر كليًا.
          if [ -n "${VERCEL_TOKEN:-}" ] && [ -n "${VERCEL_ORG_ID:-}" ] && [ -n "${VERCEL_PROJECT_ID:-}" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
            echo "أسرار النشر الثلاثة متوفّرة — سيتم النشر." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            {
              echo "### لم يُنفَّذ النشر: أسرار Vercel غير مضبوطة"
              echo ""
              echo "المطلوب في Settings → Secrets and variables → Actions:"
              echo '`VERCEL_TOKEN` و`VERCEL_ORG_ID` و`VERCEL_PROJECT_ID`'
              echo ""
              echo "إن كان المستودع مربوطًا بـ Vercel من لوحة Vercel (Git Integration)"
              echo "فالنشر يحدث هناك مباشرةً ولا حاجة لهذه الخطوة."
              echo ""
              echo "الخطوات الكاملة في \`DEPLOY.md\`."
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::notice title=Deploy skipped::أسرار Vercel غير مضبوطة — مهمة النشر ستكون skipped."
          fi

  deploy:
    name: نشر الإنتاج على Vercel
    needs: gate
    if: needs.gate.outputs.ready == 'true'
    runs-on: ubuntu-latest
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - name: تنزيل الشيفرة
        uses: actions/checkout@v5

      - name: تهيئة Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm

      - name: تثبيت Vercel CLI
        run: npm install --global vercel@latest

      - name: جلب إعدادات المشروع
        run: vercel pull --yes --environment=production --token="$VERCEL_TOKEN"

      - name: النشر للإنتاج
        run: |
          set -euo pipefail
          vercel deploy --prod --yes --token="$VERCEL_TOKEN" 2>&1 | tee deploy.log
          url="$(grep -Eo 'https://[A-Za-z0-9._-]+\.vercel\.app' deploy.log | tail -n1 || true)"
          {
            echo "### ✅ تم النشر"
            echo ""
            echo "**الرابط:** ${url:-راجع سجل الخطوة أعلاه}"
          } >> "$GITHUB_STEP_SUMMARY"
