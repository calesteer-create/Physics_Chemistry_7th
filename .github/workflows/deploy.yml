# نشر المنصة كموقع ثابت (Static Export) على GitHub Pages.
#
# لماذا GitHub Pages: المنصة تعليمية بالكامل في المتصفح — لا حسابات، ولا قاعدة
# بيانات، ولا مسارات API. لذلك تُبنى مرة واحدة إلى ملفات HTML/CSS/JS في `out/`
# وتُخدم كملفات ثابتة تحت مسار المستودع `/Physics_Chemistry_7th/`.
#
# لا أسرار ولا متغيّرات بيئة مطلوبة: أي push على `main` (أو تشغيل يدوي) يبني
# ويتحقق ثم ينشر تلقائياً. التحقق (lint + typecheck + اختبارات) يسبق النشر، وأي
# فشل فيه يمنع النشر ويُبقي النسخة السابقة على الرابط.

name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: فحص البناء والاختبارات
    runs-on: ubuntu-latest
    steps:
      - name: تنزيل الشيفرة
        uses: actions/checkout@v5
        with:
          # اختبار ثبات الملفات القديمة يقارنها بـ commit الأساس عبر git show.
          # العمق الافتراضي (1) يحذف ذلك المرجع ويُفشل الاختبار في CI فقط.
          fetch-depth: 0

      - name: تهيئة Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm

      - name: تثبيت الاعتماديات
        run: npm ci

      - name: تدقيق الشيفرة
        run: npm run lint

      - name: فحص الأنواع
        run: npm run typecheck

      - name: اختبارات الوحدة
        run: npm test

      # التصدير الثابت: ينتج مجلد `out/` كاملاً بلا قاعدة بيانات وبلا أسرار.
      - name: بناء الموقع الثابت
        run: npm run build

      # فحص مخرجات التصدير نفسها: صفحات الوحدات موجودة، وصفحة الوحدة موصولة من
      # «الوحدات الدراسية»، وبطاقة المراجعة آخر عنصر في main. هذه الاختبارات
      # تحتاج `out/`، لذلك تُشغَّل هنا **بعد** البناء لا قبله. ولا تتجاوز بصمت:
      # غياب `out/` أو أي مخرج مطلوب يُفشل الـ job.
      - name: اختبارات الوصول في التصدير المنشور
        run: npm run test:export

      # تحقق من مخرجات البناء نفسها: كل صفحة مطلوبة موجودة كـ index.html،
      # ومجلد `_next` للأصول موجود، وملف `.nojekyll` موجود (وإلا حجب Jekyll `_next`).
      - name: التحقق من مخرجات التصدير
        run: |
          set -euo pipefail
          test -d out
          test -f out/.nojekyll
          test -d out/_next
          for page in \
            index.html \
            units/index.html \
            lab/index.html \
            quizzes/index.html \
            lessons/platform-orientation/index.html \
            lessons/motion-and-rest/index.html \
            lessons/force-and-motion/index.html \
            lessons/forces-on-one-support/index.html \
            lessons/work-and-power/index.html \
            lessons/simple-machines/index.html \
            quizzes/quiz-orientation/index.html \
            quizzes/quiz-motion-1/index.html \
            quizzes/quiz-force-2/index.html \
            quizzes/quiz-one-support-3/index.html \
            quizzes/quiz-work-power-4/index.html \
            quizzes/quiz-simple-machines-5/index.html \
            quizzes/quiz-unit-1/index.html \
            units/unit-1/index.html \
            units/unit-1/review/index.html \
            units/unit-2/index.html \
            units/unit-3/index.html \
            units/unit-4/index.html \
            404.html
          do
            if [ ! -f "out/$page" ]; then
              echo "::error title=مفقود::الصفحة المطلوبة غير موجودة في التصدير: $page"
              exit 1
            fi
          done
          if grep -RqE 'href="/[^P"]|src="/[^P"]' out --include='*.html'; then
            echo "::error title=مسار جذري::وُجد رابط أو أصل مطلق لا يمرّ عبر /Physics_Chemistry_7th/"
            grep -RhoE '(href|src)="/[^P"][^"]*"' out --include='*.html' | sort -u | head -20
            exit 1
          fi
          {
            echo "### ✅ تم التحقق من التصدير الثابت"
            echo ""
            echo "الصفحات المولودة: $(find out -name 'index.html' | wc -l) + صفحة 404."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: رفع مخرجات الموقع
        uses: actions/upload-pages-artifact@v4
        with:
          path: out

  deploy:
    name: النشر على GitHub Pages
    needs: verify
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: النشر
        id: deployment
        uses: actions/deploy-pages@v4

      - name: ملخّص النشر
        run: |
          {
            echo "### ✅ تم النشر على GitHub Pages"
            echo ""
            echo "**الرابط:** ${{ steps.deployment.outputs.page_url }}"
          } >> "$GITHUB_STEP_SUMMARY"
